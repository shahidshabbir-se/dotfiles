[general]
bars = 71
framerate = 60
sensitivity = 120
scaling = linear
lower_cutoff_freq = 45
higher_cutoff_freq = 14000
sleep_timer = 0

[input]
method = pipewire
source = auto
active = 1
virtual = 1

[output]
method = raw
raw_target = /dev/stdout
data_format = ascii
ascii_max_range = 7
bar_delimiter = 59
frame_delimiter = 10
channels = mono
mono_option = average

[smoothing]
integral = 65
monstercat = 1
waves = 0
